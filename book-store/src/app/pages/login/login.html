<section class="login-section">
  <div class="container py-5">
    <div class="text-center login-header ">
      <h1>Welcome Back</h1>
      <p>Login to your BookNest account</p>
    </div>
    <div class="login-body">

      <form class="card shadow-sm mx-auto login-form" (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label">
            Email
          </label>
          <input class="form-control" type="email" required placeholder="Enter your email" [(ngModel)]="email"
            name="email" #emailInput="ngModel" required>
          @if(emailInput.invalid && emailInput.touched){
          <small class="text-danger"> email is required</small>
          }
        </div>

        <div class="mb-3">
          <label class="form-label">
            Password
          </label>
          <input type="password" placeholder="Enter your password " required class="form-control" [(ngModel)]="password"
            name="password" #passwordInput="ngModel" required>
          @if(passwordInput.invalid && passwordInput.touched){
          <small class="text-danger"> password is required</small>
          }

        </div>
        <button class="btn btn-dark">Login</button>
        <div class=" register">
          <p>Don't have an account?</p>
          <a routerLink="/register" routerLinkActive="active">Register</a>
        </div>

      </form>
    </div>
  </div>
</section>
