<section>
  <div class="container py-5">
    <div class="header text-center">
      <h1> Contact Us</h1>
      <p>We'd love to hear from you</p>
    </div>
    <div class="row g-4">


      <div class="col-md-5 ">
        <div class="card shadow-sm p-4 h-100">
          <h4 class="text mb-4">Get In Touch </h4>

          <div class="mb-3 contact-item d-flex align-items-start gap-3">
            <i class="bi bi-envelope"></i>
            <div>
              <p class="mb-0 text-muted small">Email</p>
              <p class="fw-bold mb-0">booknest@example.com</p>
            </div>
          </div>

          <div class="contact-item mb-3 d-flex align-items-start gap-3">
            <i class="bi bi-telephone"></i>
            <div>
              <p class="text-muted small mb-0">Phone</p>
              <p class="fw-bold mb-0">+20 123 456 789</p>
            </div>
          </div>


          <div class="mb-3 contact-item d-flex align-items-start gap-3">
            <i class="bi bi-geo-alt"></i>
            <div>
              <p class="text-muted small mb-0">Address</p>
              <p class="fw-bold mb-0">Cairo, Egypt</p>
            </div>
          </div>

          <div class="social mt-auto pt-3 border-top">
            <h4 class="fs-5 mb-3">Follow Us</h4>

            <div class=" d-flex gap-3">
              <a href="#" class="social-box">
                <i class="bi bi-facebook facebook"></i></a>
              <a href="#" class="social-box">

                <i class="bi bi-instagram insta"></i></a>
              <a href="#" class="social-box">

                <i class="bi bi-linkedin linkd"></i></a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-7">

        <div class="card shadow-sm p-4 h-100">

          <h3 class="mb-4 text">
            Send Us a Message
          </h3>

          <form>

            <!-- Name -->
            <div class="mb-3">
              <label class="  form-label">
                Name
              </label>

              <input type="text" class="form-control" placeholder="Enter your name">
            </div>


            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">
                Email
              </label>

              <input type="email" class="form-control" placeholder="Enter your email">
            </div>


            <!-- Subject -->
            <div class="mb-3">
              <label class="form-label">
                Subject
              </label>

              <input type="text" class="form-control" placeholder="Enter subject">
            </div>


            <!-- Message -->
            <div class="mb-3">
              <label class="form-label">
                Message
              </label>

              <textarea class="form-control" rows="5" placeholder="Write your message..."></textarea>
            </div>


            <!-- Button -->
            <button type="submit" class="btn btn-dark px-4">
              <i class="bi bi-send me-2"></i>
              Send Message
            </button>

          </form>

        </div>
      </div>
    </div>
  </div>


</section>
